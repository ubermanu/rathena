name: Publish images

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TARGETS: >-
    [
      {"key": "prere-20131223", "image": "rathena-prere", "packetver": "20131223", "prere": "yes", "default": true},
      {"key": "prere-20200304", "image": "rathena-prere", "packetver": "20200304", "prere": "yes", "default": false},
      {"key": "renewal-20220406", "image": "rathena-renewal", "packetver": "20220406", "prere": "no", "default": true}
    ]

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: echo "matrix=$(echo '${{ env.TARGETS }}' | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            PACKETVER=${{ matrix.target.packetver }}
            PRERE=${{ matrix.target.prere }}
            PACKET_OBFUSCATION=no
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.target.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target.key }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.key }}-${{ matrix.platform.arch }}

      - name: Export digest
        run: |
          digest='${{ steps.build.outputs.digest }}'
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.target.key }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: [targets, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.target.key }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.target.image }}"
          tags="-t ${image}:$(date -u +%Y%m%d)-packet${{ matrix.target.packetver }}"
          if [ "${{ matrix.target.default }}" = "true" ]; then
            tags="${tags} -t ${image}:nightly -t ${image}:latest"
          fi
          docker buildx imagetools create ${tags} \
            $(printf "${image}@sha256:%s " $(ls /tmp/digests))
